name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify semantic version tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'release tag must be semantic vX.Y.Z: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          }

      - name: Verify, build, and package
        run: make clean release-gate VERSION="$GITHUB_REF_NAME"

      - name: Upload verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: |
            dist/oscar-corrtest_${{ github.ref_name }}_linux_amd64.tar.gz
            dist/oscar-corrtest_${{ github.ref_name }}_linux_arm64.tar.gz
            dist/oscar-corrtest_${{ github.ref_name }}_darwin_amd64.tar.gz
            dist/oscar-corrtest_${{ github.ref_name }}_darwin_arm64.tar.gz
            dist/oscar-corrtest_${{ github.ref_name }}_windows_amd64.zip
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  windows-smoke:
    needs: verify
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: dist

      - name: Exercise the Windows installer and executable
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-install-windows.ps1 -Version "$env:GITHUB_REF_NAME" -AssetDirectory dist

  publish:
    needs: [verify, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: dist

      - name: Verify downloaded release set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing its verified assets."
            gh release upload "$GITHUB_REF_NAME" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_linux_arm64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_windows_amd64.zip" \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_linux_arm64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_darwin_amd64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_darwin_arm64.tar.gz" \
              "dist/oscar-corrtest_${GITHUB_REF_NAME}_windows_amd64.zip" \
              dist/SHA256SUMS \
              --verify-tag --generate-notes
          fi
