name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify immutable action pins
        shell: bash
        run: |
          set -euo pipefail
          invalid="$(grep -hE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/*.yml \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]*#.*)?$' || true)"
          if [[ -n "$invalid" ]]; then
            printf 'workflow actions must use 40-character revisions:\n%s\n' "$invalid" >&2
            exit 1
          fi

      - name: Verify, build, and package
        run: make ci

      - name: Upload Linux archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oscar-corrtest-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
