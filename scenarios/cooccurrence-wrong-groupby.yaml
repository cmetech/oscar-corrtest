apiVersion: corrtest.oscar/v1alpha1
kind: CorrelationScenario
name: cooccurrence-wrong-groupby
suite: corrtest-negdepth
pattern: co_occurrence
maxDuration: 90s
cases:
  - name: both-required-roles-in-one-site-emit
    code: P01
    polarity: positive
    window: 30s
    groupBy: [site]
    labels: {site: cowg-p01}
    events:
      - {role: disk_full, status: firing}
      - {role: cpu_high, status: firing, delay: 1s}
    assertions:
      - {kind: audit-count, outcome: parent_emitted, equals: 1}
      - {kind: synthetic-alert-count, equals: 1}
  - name: required-roles-split-across-two-sites-never-co-occur-in-a-group
    code: N01
    polarity: negative
    window: 30s
    groupBy: [site]
    events:
      - {role: disk_full, status: firing, labels: {site: cowg-n01-a}}
      - {role: cpu_high, status: firing, delay: 1s, labels: {site: cowg-n01-b}}
    assertions:
      - {kind: audit-count, outcome: parent_emitted, equals: 0}
      - {kind: synthetic-alert-count, equals: 0}
